server:
  port: 8081

spring:
  application:
    name: scrapper
  grpc:
    server:
      port: 9091

bot:
  transport: grpc
  http:
    base-url: http://localhost:8080
  grpc:
    host: localhost
    port: 9090

app:
  stackoverflow:
    base-url: https://api.stackexchange.com/2.3
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN}
