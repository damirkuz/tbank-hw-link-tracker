server:
  port: 8080

spring:
  application:
    name: bot

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${APP_TELEGRAM_TOKEN}
    update-listener-sleep: 1s
    debug: false

bot:
  messages:
    start-command: "Привет, напиши /help, чтобы посмотреть доступные команды"
    help-command: "Доступные команды:\n/start\n/help"
    unknown-update: "Неизвестная команда. Воспользуйтесь /help, чтобы посмотреть список доступных команд."
