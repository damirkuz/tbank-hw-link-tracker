server:
  port: 8080

spring:
  application:
    name: bot

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${APP_TELEGRAM_TOKEN}
    update-listener-sleep: 1s
    debug: false

bot:
  messages:
    start-command:
      command: "/start"
      description: "Запустить бота"
      answer: "Привет, напиши /help, чтобы посмотреть доступные команды"
    help-command:
      command: "/help"
      description: "Показать помощь"
      answer: "Доступные команды:\n/start\n/help"
    unknown-update:
      answer: "Неизвестная команда. Воспользуйтесь /help, чтобы посмотреть список доступных команд."

